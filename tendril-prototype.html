<title>Tendril Strike</title>
<style>
/* layout: fullscreen canvas stage, dark arena, HUD bottom-left, hint top-center */
:root{
  --bg:#0b0b12;
  --bg2:#14121c;
  --fg:#e8e4f0;
  --muted:#8a84a0;
  --light:#fff4d6;
  --light-glow:#ffe9a8;
  --dark:#5b2a86;
  --dark-glow:#2a0f45;
  --accent:#e0506b;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{
  font-family:'Space Grotesk', system-ui, sans-serif;
  color:var(--fg);
}
@font-face{
  font-family:'Cinzel';
  src:local('Cinzel');
}
#stage{position:fixed;inset:0;display:block;cursor:crosshair}
.hud{
  position:fixed;
  left:16px;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:14px 18px;
  background:rgba(14,12,20,0.72);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  backdrop-filter:blur(6px);
  font-size:13px;
  color:var(--muted);
  max-width:260px;
  pointer-events:none;
}
.hud b{color:var(--fg);font-weight:600}
.hud .row{display:flex;justify-content:space-between;gap:12px}
.hint{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  background:rgba(14,12,20,0.72);
  border:1px solid rgba(255,255,255,0.08);
  padding:8px 16px;
  border-radius:999px;
  pointer-events:none;
  text-align:center;
}
.hint b{color:var(--light-glow)}
.hint i{color:var(--dark);font-style:normal;color:#b98cf0}
.title{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  right:16px;
  font-family:'Cinzel', Georgia, serif;
  font-size:14px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  pointer-events:none;
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap">

<canvas id="stage"></canvas>
<div class="title">Tendril Strike — Prototype</div>
<div class="hint">move mouse to steer &middot; <b>left click</b> = light lash &middot; <i>right click</i> = dark lash</div>
<div class="hud">
  <div class="row"><span>Light tendril</span><b id="lightStat">ready</b></div>
  <div class="row"><span>Dark tendril</span><b id="darkStat">ready</b></div>
  <div class="row"><span>Dummies down</span><b id="killCount">0</b></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.width = Math.floor(innerWidth*DPR);
    H = canvas.height = Math.floor(innerHeight*DPR);
    canvas.style.width = innerWidth+'px';
    canvas.style.height = innerHeight+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  addEventListener('resize', resize);

  const mouse = {x: innerWidth/2+150, y: innerHeight/2, down:false, rdown:false};
  addEventListener('mousemove', e=>{ mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mousedown', e=>{
    if(e.button===0) mouse.down = true;
    if(e.button===2) mouse.rdown = true;
  });
  addEventListener('mouseup', e=>{
    if(e.button===0) mouse.down = false;
    if(e.button===2) mouse.rdown = false;
  });
  addEventListener('contextmenu', e=>e.preventDefault());
  addEventListener('touchmove', e=>{
    const t = e.touches[0];
    if(t){ mouse.x=t.clientX; mouse.y=t.clientY; }
  }, {passive:true});
  addEventListener('touchstart', e=>{ mouse.down = true; }, {passive:true});
  addEventListener('touchend', ()=>{ mouse.down = false; });

  // player
  const player = { x: innerWidth/2, y: innerHeight/2, r: 16 };

  // Verlet chain tendril
  function makeChain(anchorOffsetX, segCount, segLen){
    const pts = [];
    for(let i=0;i<segCount;i++){
      pts.push({
        x: player.x + anchorOffsetX,
        y: player.y,
        px: player.x + anchorOffsetX,
        py: player.y
      });
    }
    return { pts, segLen, anchorOffsetX, striking:0, cooldown:0 };
  }

  const SEG_COUNT = 14;
  const SEG_LEN = 16;
  const light = makeChain(-26, SEG_COUNT, SEG_LEN);
  const dark = makeChain(26, SEG_COUNT, SEG_LEN);

  function updateChain(chain, targetX, targetY, striking){
    const pts = chain.pts;
    const anchorX = player.x + chain.anchorOffsetX;
    const anchorY = player.y;

    // reach extension when striking
    const reach = striking ? chain.segLen * 1.9 : chain.segLen;

    // drive the tip toward the target (the "control")
    const tip = pts[pts.length-1];
    const pullStrength = striking ? 0.55 : 0.22;
    tip.x += (targetX - tip.x) * pullStrength;
    tip.y += (targetY - tip.y) * pullStrength;

    // verlet integrate the rest with slight gravity/drag for organic sag
    for(let i=0;i<pts.length-1;i++){
      const p = pts[i];
      const vx = (p.x - p.px) * 0.94;
      const vy = (p.y - p.py) * 0.94;
      p.px = p.x; p.py = p.y;
      p.x += vx;
      p.y += vy + 0.25; // gravity sag
    }

    // constraint solve: anchor fixed, then distance constraints, tip pulled too
    pts[0].x = anchorX; pts[0].y = anchorY;
    for(let iter=0; iter<6; iter++){
      for(let i=0;i<pts.length-1;i++){
        const a = pts[i], b = pts[i+1];
        let dx = b.x-a.x, dy = b.y-a.y;
        let dist = Math.hypot(dx,dy) || 0.0001;
        const diff = (dist - reach)/dist;
        const isAnchor = (i===0);
        const isTip = (i+1 === pts.length-1);
        const moveA = isAnchor ? 0 : 0.5;
        const moveB = isTip ? 0.15 : 0.5;
        a.x += dx*diff*moveA; a.y += dy*diff*moveA;
        b.x -= dx*diff*moveB; b.y -= dy*diff*moveB;
      }
      pts[0].x = anchorX; pts[0].y = anchorY;
    }
  }

  // dummies (targets)
  function spawnDummy(){
    const margin = 80;
    return {
      x: margin + Math.random()*(innerWidth-margin*2),
      y: margin + Math.random()*(innerHeight-margin*2),
      r: 22,
      hp: 100,
      maxHp: 100,
      flash: 0,
      alive: true
    };
  }
  let dummies = Array.from({length:4}, spawnDummy);
  let kills = 0;

  function segmentHitsCircle(ax,ay,bx,by,cx,cy,cr){
    const dx=bx-ax, dy=by-ay;
    const len2 = dx*dx+dy*dy || 0.0001;
    let t = ((cx-ax)*dx + (cy-ay)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    const px = ax+dx*t, py = ay+dy*t;
    return Math.hypot(cx-px, cy-py) <= cr;
  }

  function applyDamage(chain, dmg, label){
    const pts = chain.pts;
    for(const d of dummies){
      if(!d.alive) continue;
      for(let i=0;i<pts.length-1;i++){
        if(segmentHitsCircle(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y, d.x,d.y,d.r)){
          d.hp -= dmg;
          d.flash = 1;
          if(d.hp<=0){ d.alive=false; kills++; document.getElementById('killCount').textContent = kills; }
          break;
        }
      }
    }
  }

  // damage tuning: light = fast/weak, dark = slow/heavy
  let lightTick=0, darkTick=0;

  function drawChain(chain, colorCore, colorGlow, glowSize){
    const pts = chain.pts;
    ctx.save();
    ctx.lineJoin='round';
    ctx.lineCap='round';

    ctx.shadowColor = colorGlow;
    ctx.shadowBlur = glowSize;
    ctx.strokeStyle = colorGlow;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = colorCore;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // tip glow dot
    const tip = pts[pts.length-1];
    ctx.fillStyle = colorCore;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawDummy(d){
    if(!d.alive) return;
    ctx.save();
    const flashAmt = d.flash;
    ctx.shadowColor = flashAmt>0 ? '#ff6b6b' : 'rgba(0,0,0,0)';
    ctx.shadowBlur = flashAmt>0 ? 20 : 0;
    ctx.fillStyle = flashAmt>0 ? '#ffbcbc' : '#3a3550';
    ctx.strokeStyle = '#6b6490';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // hp bar
    const w = 50, h=6;
    const pct = Math.max(0,d.hp/d.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(d.x-w/2, d.y-d.r-16, w, h);
    ctx.fillStyle = pct>0.4 ? '#8ee08e' : '#e08e8e';
    ctx.fillRect(d.x-w/2, d.y-d.r-16, w*pct, h);

    d.flash *= 0.85;
  }

  function drawPlayer(){
    ctx.save();
    ctx.fillStyle = '#d8d2ea';
    ctx.shadowColor = '#b98cf0';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(){
    ctx.fillStyle = '#0b0b12';
    ctx.fillRect(0,0,innerWidth,innerHeight);
    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const grid = 48;
    for(let x=0;x<innerWidth;x+=grid){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke();
    }
    for(let y=0;y<innerHeight;y+=grid){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke();
    }
  }

  function respawnIfNeeded(){
    if(dummies.every(d=>!d.alive)){
      dummies = Array.from({length:4}, spawnDummy);
    }
  }

  const lightStat = document.getElementById('lightStat');
  const darkStat = document.getElementById('darkStat');

  function loop(){
    drawBackground();

    // light: fast/weak, short cooldown
    updateChain(light, mouse.x, mouse.y, mouse.down);
    if(mouse.down){
      lightTick++;
      if(lightTick % 6 === 0) applyDamage(light, 6, 'light');
      lightStat.textContent = 'lashing';
    } else {
      lightTick = 0;
      lightStat.textContent = 'ready';
    }

    // dark: slow/heavy, needs charge-ish feel via lower tick rate but more dmg
    updateChain(dark, mouse.x, mouse.y, mouse.rdown);
    if(mouse.rdown){
      darkTick++;
      if(darkTick % 14 === 0) applyDamage(dark, 22, 'dark');
      darkStat.textContent = 'crushing';
    } else {
      darkTick = 0;
      darkStat.textContent = 'ready';
    }

    drawChain(dark, '#b98cf0', '#5b2a86', 26);
    drawChain(light, '#fff4d6', '#ffe9a8', 22);
    drawPlayer();
    dummies.forEach(drawDummy);
    respawnIfNeeded();

    requestAnimationFrame(loop);
  }

  // boot (supports host hot-reload snapshot if present)
  function start(saved){
    if(saved && saved.kills) { kills = saved.kills; document.getElementById('killCount').textContent = kills; }
    requestAnimationFrame(loop);
  }
  try{
    if(window.claude?.hot?.snapshot){
      window.claude.hot.snapshot(()=>({kills}));
    }
    if(window.claude?.hot?.ready){
      window.claude.hot.ready(start);
    } else {
      start(window.claude?.hot?.data);
    }
  }catch(e){ start(); }
})();
</script>
